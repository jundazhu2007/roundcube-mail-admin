# Managed by the mail-admin installer (Dovecot 2.4 syntax). The distribution's original file is kept
# as dovecot.conf.pre-mail-admin. Mailboxes/passwords come from the admin panel, not from this file:
# /etc/dovecot/virtual-users is regenerated from the database on every mailbox change.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols {
  imap = yes
}

# IMAPS only (993). Plain 143 is disabled, TLS is mandatory.
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

ssl = required
ssl_min_protocol = TLSv1.2
ssl_server {
  cert_file = /etc/mail-admin/tls/fullchain.pem
  key_file = /etc/mail-admin/tls/privkey.pem
  prefer_ciphers = server
}

# Authentication: flat password file maintained by the admin panel
auth_mechanisms = plain login
passdb passwd-file {
  passwd_file_path = /etc/dovecot/virtual-users
}
userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = @MAILDATA_PATH@/%{user|domain}/%{user|username}
  }
}

# Postfix uses this socket for SMTP AUTH on ports 465/587
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

mail_driver = maildir
mail_home = @MAILDATA_PATH@/%{user|domain}/%{user|username}
mail_path = ~/Maildir

namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
}
