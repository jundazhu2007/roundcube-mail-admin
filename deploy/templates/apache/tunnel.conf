# Cloudflare Tunnel origin: cloudflared connects to http://localhost:8080. Loopback only; TLS is terminated by Cloudflare.
# Managed by the mail-admin installer.
Listen 127.0.0.1:8080
<VirtualHost 127.0.0.1:8080>
    ServerName @MAIL_HOSTNAME@
    ServerAlias *

    # The real visitor address arrives in CF-Connecting-IP; only trust it from cloudflared on this host.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPInternalProxy 127.0.0.1

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

@ROOT_REDIRECT_LINE@
    IncludeOptional /etc/apache2/mail-admin/webmail.inc
@TUNNEL_ADMIN_INCLUDE@</VirtualHost>
