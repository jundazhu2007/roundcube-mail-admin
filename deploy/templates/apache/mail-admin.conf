# Managed by the mail-admin installer.
# Name-based vhosts for the web UI. Port 80 only serves ACME challenges and redirects to HTTPS.
<VirtualHost *:80>
    ServerName @MAIL_HOSTNAME@
@SERVER_ALIAS_LINE@    DocumentRoot /var/www/html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName @MAIL_HOSTNAME@
@SERVER_ALIAS_LINE@
    SSLEngine on
    SSLCertificateFile /etc/mail-admin/tls/fullchain.pem
    SSLCertificateKeyFile /etc/mail-admin/tls/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

@ROOT_REDIRECT_LINE@
    IncludeOptional /etc/apache2/mail-admin/webmail.inc
    IncludeOptional /etc/apache2/mail-admin/admin.inc
</VirtualHost>
