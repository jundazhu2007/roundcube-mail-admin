# One "name = value" per line; applied with `postconf -e` by the installer.
myhostname = @MAIL_HOSTNAME@
mydomain = @MAIL_DOMAIN@
myorigin = $mydomain
mydestination = $myhostname, localhost.$mydomain, localhost
mynetworks_style = host
inet_interfaces = all
inet_protocols = @INET_PROTOCOLS@
smtpd_banner = $myhostname ESMTP
biff = no
disable_vrfy_command = yes
recipient_delimiter = +
message_size_limit = @MAX_MESSAGE_BYTES@
mailbox_size_limit = 0

# TLS (certificate paths are stable symlinks managed by the installer)
smtpd_tls_cert_file = /etc/mail-admin/tls/fullchain.pem
smtpd_tls_key_file = /etc/mail-admin/tls/privkey.pem
smtpd_tls_security_level = may
smtpd_tls_auth_only = yes
smtpd_tls_protocols = >=TLSv1.2
smtpd_tls_mandatory_protocols = >=TLSv1.2
smtpd_tls_loglevel = 1
smtpd_tls_session_cache_database = btree:${data_directory}/smtpd_scache
smtp_tls_security_level = may
smtp_tls_CAfile = /etc/ssl/certs/ca-certificates.crt
smtp_tls_loglevel = 1
smtp_tls_session_cache_database = btree:${data_directory}/smtp_scache

# Policy: port 25 only accepts mail for our own domains; relaying needs authentication (ports 465/587)
smtpd_relay_restrictions = permit_mynetworks, permit_sasl_authenticated, defer_unauth_destination
smtpd_recipient_restrictions = permit_sasl_authenticated, permit_mynetworks, reject_unauth_destination
smtpd_sasl_auth_enable = no
smtpd_sasl_type = dovecot
smtpd_sasl_path = private/auth
smtpd_sasl_security_options = noanonymous
broken_sasl_auth_clients = yes
smtpd_sender_login_maps = proxy:mysql:/etc/postfix/mysql/sender-login-maps.cf
smtpd_client_connection_count_limit = 20
smtpd_client_connection_rate_limit = 30
smtpd_client_message_rate_limit = 60
anvil_rate_time_unit = 60s

# Virtual domains, mailboxes and aliases live in MariaDB (managed by the admin panel)
virtual_mailbox_domains = mysql:/etc/postfix/mysql/virtual-mailbox-domains.cf
virtual_mailbox_maps = mysql:/etc/postfix/mysql/virtual-mailbox-maps.cf
virtual_alias_maps = mysql:/etc/postfix/mysql/virtual-alias-maps.cf
virtual_transport = virtual
virtual_mailbox_base = @MAILDATA_PATH@
virtual_uid_maps = static:@VMAIL_UID@
virtual_gid_maps = static:@VMAIL_UID@
virtual_minimum_uid = @VMAIL_UID@
