name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts (syntax + shellcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          files="install.sh dev-setup.sh deploy/build-release.sh deploy/installer/main.sh $(ls deploy/installer/lib/*.sh deploy/installer/tests/*.sh deploy/sbin/* tests/integration/run.sh | grep -v mail-admin-helper)"
          for f in $files; do bash -n "$f"; done
          shellcheck -x -S warning $files

      - name: Python (compile)
        run: python3 -m py_compile api/*.py api/routers/*.py deploy/sbin/mail-admin-helper

      - name: Frontend (lint + build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-audit --no-fund && npm run build

      - name: Template checks against the real tools
        run: |
          sudo apt-get install -y -qq apache2 php-cli nftables
          echo "postfix postfix/main_mailer_type select No configuration" | sudo debconf-set-selections
          sudo apt-get install -y -qq postfix dovecot-core || true
          bash deploy/installer/tests/render-check.sh

      - name: API integration test (MariaDB + helper + doveadm)
        run: |
          sudo apt-get install -y -qq mariadb-server dovecot-core python3-venv
          sudo systemctl stop mariadb || true
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q -r requirements.txt httpx
          PYTHON=/tmp/venv/bin/python bash tests/integration/run.sh
